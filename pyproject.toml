[project]
name = "syntropy-lhm"
version = "0.1.0"
description = "LHM — Longevity Health Metrics SDK: chat-programmable, clinically-modelled n-of-1 personal metrics (correlation-not-causation by construction)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Syntropy Health" }]
keywords = ["fhir", "n-of-1", "health-metrics", "quantified-self"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Dep set per the A&D D2 (researcher-grounded 2026-07-08, workstreams/
# syntropy-lhm-sdk/research/deps-clinical-modelling.md):
#   fhir.resources — the pydantic-v2 FHIR typed-model layer (BSD; nazrulworld
#     line; EXACT pin per the bus-factor mitigation — bump deliberately).
#   NO terminology library (codes are plain Coding fields + a curated table).
#   NO web framework / HTTP / DB — the SDK is app-independent (A&D D1).
dependencies = [
    "pydantic>=2.7,<3",
    "fhir.resources==8.3.0",
]

[project.urls]
# Pre-split home (design 0002: LHM lives inside the journals repo through
# L4); the D13 repo split updates these to the standalone repo.
Homepage = "https://github.com/Syntropy-Health/lhm"
Repository = "https://github.com/Syntropy-Health/lhm"
Documentation = "https://github.com/Syntropy-Health/lhm/tree/main/docs"

[project.optional-dependencies]
# UCUM units for Observation quantities (A&D D2) — optional extra. NOTE
# (QGR L0 design-F2, recorded A&D deviation): the CORE floor is deliberately
# 3.11 (matches the host app toolchain + these units deps), NARROWER than
# fhir.resources' own 3.8-3.14 band; widening the floor is a PyPI-launch
# decision, not an L0 one.
units = [
    "pint>=0.25,<0.26",
    "ucumvert>=0.3,<0.4",
]
# Interpretable per-domain scoring engine (health-dashboard A&D D-D /
# §2.4): statsmodels covers all four v1 estimators; sklearn stays in the
# extra for isotonic/monotone calibration when a domain needs it. Extra
# missing → metrics/scoring.py degrades to SCORING_AVAILABLE=False and
# the recorded "stub" method (a stub never passes readiness — R5b).
lhm-scoring = [
    "statsmodels>=0.14,<0.15",
    "scikit-learn>=1.5,<2",
]
# HTTP transport for the L4 HttpPublisher (design 0001 §6 / D12: transport
# arrives as an opt-in extra; httpx is BSD-3-Clause). The envelope/receipt
# models work WITHOUT it — only HttpPublisher requires the import (lazy,
# with an error naming this extra).
publish = [
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=77"]  # SPDX `license` + `license-files` (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["syntropy*"]
namespaces = true

[tool.setuptools.package-data]
# The committed viz contract ships INSIDE the wheel (A&D D5/F11) so installed
# consumers can validate against the exact schema.
"syntropy.lhm" = ["contracts/*.json", "contracts/fixtures/**/*.json", "py.typed"]

[tool.pytest.ini_options]
# Self-rooted pytest config (QGR L0 code-F8): without this, running the suite
# from LHM/ walks rootdir up to the APP's pyproject and inherits app-only
# addopts (--record-mode) that break standalone/clean-env runs.
addopts = ""
testpaths = ["tests"]
# L2: the pipeline tools are async — auto mode matches the host app's pytest
# config (pytest-asyncio ships in the app dev group; the R7 clean-env gate
# exercises sync suites only).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
